<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>__TITLE__</title>
  <style type="text/css">
__FONT_FACE__
  :root {
    --bg: #f2f5f4;
    --card: #ffffff;
    --ink: #1f2a30;
    --muted: #64748b;
    --accent: #14735f;
    --accent-soft: #e3f1ec;
    --line: #dfe5e3;
    --key-shadow: #d3dbd8;
    --overlay: rgba(16, 28, 26, 0.45);
    --toolbar-bg: rgba(255, 255, 255, 0.9);
    --radius: 14px;
    --root-font: __EXTRA_FONT__ "TH-Tshyn-P0", "TH-Tshyn-P1", "TH-Tshyn-P2",
                 "KaiXinSongA", "KaiXinSongB",
                 "SimSun", "SimSun-ExtB", "SimSun-ExtG",
                 "WenJin Mincho Plane 0", "WenJin Mincho Plane 2", "WenJin Mincho Plane 3",
                 "SuperHan0ivd", "SuperHan2ivd", "SuperHan3ivd",
                 "FSung-m", "FSung-1", "FSung-2", "FSung-3", "FSung-F", "FSung-X",
                 "Jigmo", "Jigmo2", "Jigmo3", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1518;
      --card: #1a2327;
      --ink: #e8eef0;
      --muted: #8fa3ad;
      --accent: #3aa58c;
      --accent-soft: #16302a;
      --line: #2a373d;
      --key-shadow: #0a0f11;
      --overlay: rgba(4, 10, 12, 0.62);
      --toolbar-bg: rgba(26, 35, 39, 0.9);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.5;
  }

  ::selection { background: var(--accent); color: #fff; }

  a { color: var(--accent); }

  #page_header {
    text-align: center;
    margin: 26px 16px 4px;
  }

  #page_header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .traditional {
    color: var(--muted);
  }

  /* 繁体根 / 罕用根：清单来自 繁体字根.txt / 罕用字根.txt，显式标注 */
  .trad_root {
    background-color: #ffe9c8;
  }

  .rare_root {
    background-color: #f0e6fb;
  }

  #legend {
    display: none;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 22px;
    margin: 4px auto 12px;
    font-size: 14px;
    color: var(--muted);
    align-items: center;
  }

  #legend .swatch {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 7px;
    color: var(--ink);
  }

  /* ── 键盘字根图 ─────────────────────────────────────────── */
  #keyboard {
    max-width: 1500px;
    margin: 16px auto 34px;
    padding: 0 20px;
    overflow-x: auto;
  }

  #keyboard table {
    border-collapse: separate;
    border-spacing: 12px;
    margin: 0 auto;
  }

  #keyboard table, #keyboard th, #keyboard td {
    border: none;
    padding: 0;
  }

  .row_key th {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align: left;
    padding: 0 2px 2px;
  }

  .row_key .letter {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    border-radius: 9px;
    padding: 3px 14px;
    letter-spacing: 0.05em;
  }

  .row_root td {
    width: 152px;
    height: 128px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 3px 0 var(--key-shadow), 0 8px 18px rgba(15, 30, 26, 0.07);
    padding: 12px 14px;
    word-break: __WORD_BREAK__;
    vertical-align: top;
    transition: border-color 0.15s, transform 0.15s;
  }

  .row_root td:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .row_root td:empty {
    opacity: 0.4;
    border-style: dashed;
    box-shadow: none;
  }

  .row_root .root {
    font-family: var(--root-font);
    font-size: 25px;
    cursor: pointer;
    display: inline-block;
    padding: 1px 5px;
    border-radius: 8px;
  }

  .row_root .root:hover {
    background: var(--accent-soft);
  }

  .row_root .code {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: 3px;
    vertical-align: 2px;
    font-weight: 600;
  }

  /* ── 工具栏 ─────────────────────────────────────────────── */
  #toolbar {
    position: sticky;
    top: 10px;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 26px;
    margin: 12px auto 6px;
    padding: 10px 26px;
    max-width: 1500px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(15, 30, 26, 0.06);
  }

  #toolbar > div {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  #toolbar label {
    color: var(--muted);
    font-size: 14px;
  }

  #toolbar select, #toolbar input[type="text"] {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 12px;
    outline: none;
  }

  #toolbar select:focus, #toolbar input[type="text"]:focus {
    border-color: var(--accent);
  }

  #toolbar input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
  }

  button {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 16px;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── 弹层：帮助 / 字根详情 ──────────────────────────────── */
  #help_msg, #detail {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    background: var(--overlay);
    backdrop-filter: blur(3px);
    padding: 24px;
  }

  #help_msg ol {
    background: var(--card);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    padding: 20px 34px 20px 44px;
    max-width: 560px;
    font-size: 15px;
  }

  #detail_content {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    padding: 16px 26px;
    max-width: 780px;
    max-height: 72vh;
    overflow: auto;
  }

  #detail table {
    font-size: 17px;
    text-align: center;
    border-collapse: collapse;
  }

  #detail th, #detail td {
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 14px;
  }

  #detail th {
    color: var(--muted);
    font-weight: 600;
    font-size: 13px;
  }

  #detail td.letter {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  #detail td.code {
    font-family: ui-monospace, Consolas, monospace;
    color: var(--accent);
    font-weight: 600;
  }

  #detail td.root, #detail td.examples {
    font-family: var(--root-font);
  }

  #detail .rank, #detail .freq {
    font-variant-numeric: tabular-nums;
  }

  /* ── 拆分查询结果 ───────────────────────────────────────── */
  #chaifen_result {
    display: none;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    max-width: 1500px;
    margin: 0 auto;
    padding: 6px 20px 14px;
  }

  #chaifen_result > div {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 4px 14px rgba(15, 30, 26, 0.06);
    margin: 0;
    padding: 14px 20px;
  }

  #chaifen_result > div > div {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #chaifen_result > button.chaifen-hide {
    align-self: center;
    flex: 0 0 auto;
    white-space: nowrap;
  }

  #chaifen_result .notice {
    align-self: center;
    max-width: 320px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
  }

  #chaifen_result .notice small {
    color: var(--muted);
    opacity: 0.8;
  }

  .chaifen .rootnames {
    margin: 2px 8px 6px;
    font-size: 12px;
    color: var(--muted);
  }

  #chaifen_result a {
    text-decoration: none;
    margin-left: 2px;
    margin-right: 2px;
  }

  .chaifen .char {
    font-size: 56px;
    font-family: var(--root-font);
    line-height: 1.2;
  }

  .chaifen .unicode {
    margin: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .chaifen .unicode a {
    color: var(--muted);
  }

  .chaifen .code {
    font-size: 15px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .chaifen .code .buma {
    color: var(--muted);
    font-weight: 400;
    font-size: 0.9em;
    letter-spacing: 0;
    opacity: 0.85;
  }

  .chaifen .root {
    font-size: 22px;
    margin: 4px 8px;
    font-family: var(--root-font);
  }

  ruby rt {
    color: var(--muted);
    font-size: 11px;
    font-family: sans-serif;
  }

  @media (max-width: 1100px) {
    .row_root td { width: 124px; height: 110px; }
    .row_root .root { font-size: 21px; }
  }

  @media (max-width: 720px) {
    #page_header h1 { font-size: 20px; }
    #toolbar { gap: 6px 12px; padding: 10px 12px; }
    #keyboard table { border-spacing: 6px; }
    .row_root td { width: 96px; height: 96px; padding: 8px; }
    .row_root .root { font-size: 18px; }
  }

  @media print {
    #toolbar, #legend, button { display: none !important; }
    body { background: #fff; }
    #detail, #help_msg { display: none !important; }
  }
  </style>
</head>

<script type="text/javascript">
//<![CDATA[
"use strict";

__CHART_JS__

var page = 0;
var rootsRank = new Map();
var clickedRoot = null;
var isSingleCharRoot = __IS_SINGLE__;

function mr(r) {    // map root：字根字体恒启用，有映射就用 PUA 显示字
  if (roots_mapping && r in roots_mapping) {
    return roots_mapping[r];
  } else {
    return r;
  }
}

function rootClass(d) {   // 繁体根 / 罕用根底色
  if (d.rare_root) return " rare_root";
  if (d.trad_root) return " trad_root";
  return "";
}

// 是否显示繁体/罕用字根：默认关（用户要求默认不显示）
var showTrad = false;

function onToggleTrad(v) {
  showTrad = v;
  // 图例只在勾选时出现：关掉后页面上没有标记，图例没有意义
  document.getElementById("legend").style.display =
    (v && hasMarkedRoots()) ? "flex" : "none";
  onChangeFreq(page);
}

// 当前页该根是否展示：关掉开关时隐藏 繁体根（含罕用根）
function visible(l, c, r) {
  if (showTrad) return true;
  const d = chart_json[l][c][r];
  return !(d.trad_root || d.rare_root);
}

function hasMarkedRoots() {
  for (let l in chart_json) {
    for (let c in chart_json[l]) {
      for (let r in chart_json[l][c]) {
        const d = chart_json[l][c][r];
        if (d.trad_root || d.rare_root) return true;
      }
    }
  }
  return false;
}

function createFreqSelectBox() {
    let select = "<select id='freq' onchange='onChangeFreq(this.value)'>";
    select += `<option value="0">全部</option>`;
    for (let i = 1; i <= max_pages; ++i) {
        select += `<option value="${i}">前 ${i * page_size} 字</option>`;
    }
    select += "</select>";
    return select;
}

function onChangeFreq(p) {
    page = parseInt(p);
    // 排名按全局字频算，不随档位变，只在 onload 里算一次即可。
    document.getElementById("keyboard").innerHTML = createKeyboard();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function onChangeChaifen(text) {
  let 命中 = [], 未收录 = [];
  for (let x of charinfo(text)) {
    if (Array.isArray(x)) { 未收录.push(x[0]); continue; }
    if (x.info) 命中.push(x); else 未收录.push(x.char);
  }

  let 容器 = document.getElementById("chaifen_result");
  if (!text || (命中.length === 0 && 未收录.length === 0)) {
    容器.style.display = "none";
    容器.innerHTML = "";
    return;
  }

  let html = "";
  for (let info of 命中) {
    let unicode = info.char.codePointAt(0).toString(16).toUpperCase();
    // 字根上方只标键位字母，与全码逐位一致；两字母根码放 tooltip。
    let fmt_chaifen = (cf, idx) => {
      let 码 = info.info.codes[idx] || info.info.codes[0] || "";
      return cf.map((f, l) => {
        let 键 = (码[l] || (f.code || "").charAt(0)).toLowerCase();
        let 原名 = f.root.replace(/[{}]/g, "");
        return `<ruby title="${esc(原名)}｜${esc(f.code)}">${mr(f.root)}<rt>${键}</rt></ruby>`;
      }).join("");
    };
    // 全码前 N 位依次对应上方字根，其余是补码（小码）：用括号包起来并淡化。
    let fmt_code = (码, idx) => {
      let 串 = info.info.chaifens[idx] || info.info.chaifens[0] || [];
      let n = Math.min(Math.max(串.length, 1), 码.length);
      let 补码 = 码.slice(n);
      return esc(码.slice(0, n)) + (补码
        ? `<span class="buma" title="括号内为补码（小码），不对应字根">(${esc(补码)})</span>`
        : "");
    };
    // PUA 字形看起来像别的字时，补一行原名方便核对。
    let 原名们 = [...new Set(info.info.chaifens.flatMap(
      cf => cf.filter(f => mr(f.root) !== f.root).map(f => f.root.replace(/[{}]/g, ""))
    ))];

    html += `
        <div class="chaifen">
          <div class="char">${esc(info.char)}</div>
          <div class="unicode"><a href="https://www.unicode.org/cgi-bin/GetUnihanData.pl?codepoint=${info.char}" target="_blank" rel="noreferer" title="Unihan Database">U+${unicode}</a></div>
          <div class="code">全码 ${info.info.codes.map(fmt_code).join(" ")}</div>
          <div class="root">${info.info.chaifens.map(fmt_chaifen).join("·")}</div>
          ${原名们.length ? `<div class="rootnames">字根名：${原名们.map(esc).join(" · ")}</div>` : ""}
        </div>`;
  }

  if (未收录.length > 0) {
    html += `<div class="notice">未收录：${未收录.map(esc).join(" ")}<br><small>本图码表覆盖 __COVERED_CHARS__ 字，扩展区生僻字、字母、标点无拆分</small></div>`;
  }
  html += '<button class="chaifen-hide" onclick="hideChaifen()">隐藏</button>';
  容器.innerHTML = html;
  容器.style.display = "flex";
}

function hideChaifen() {
    document.getElementById("chaifen_result").style.display = "none";
}

// 字根组排名：按覆盖字频权重（char_freq）降序，与字集档位无关。
// 原来用 freq[page]（当前档位覆盖字数），切档位排名会变，且「木」这类
// 出现次数多但字频低的根会被排到前面；改用字频才符合「按字频排名」。
function rootFreq(d) {
  return parseFloat(d.char_freq) || 0;
}

function computeRootsRank() {
  rootsRank.clear();

  let freqs = new Map();

  for (let l in chart_json) {
    for (let c in chart_json[l]) {
      for (let r in chart_json[l][c]) {
        freqs.set(r, rootFreq(chart_json[l][c][r]));
      }
    }
  }

  let roots = [...freqs.keys()].sort((a, b) => freqs.get(b) - freqs.get(a));
  let lastFreq = freqs.get(roots[0]);
  let lastRank = 1;

  for (let i = 0; i < roots.length; ++i) {
      let r = roots[i];
      if (freqs.get(r) < lastFreq) {
        ++lastRank;
      }
      lastFreq = freqs.get(r);
      rootsRank.set(r, lastRank);
  }
}

function showDetail(tag) {
  clickedRoot = tag;

  let l = tag.dataset.letter;
  let c = tag.dataset.code;
  let r = tag.dataset.root;
  let d = chart_json[l][c][r];

  let type = d.rare_root ? "(罕用根)" : d.trad_root ? "(繁体根)" : (d.traditional ? "(繁)" : "");

  let table = `<table><thead><tr>
    <th>编码</th><th>字根</th><th>拼音</th><th>字频排名</th><th>字频</th><th>例字</th><th>备注</th>
    </tr></thead><tbody><tr>
    <td>${c}</td>
    <td>${mr(r)} ${type}</td>
    <td>${d.pinyin}</td>
    <td>${rootsRank.get(r)}</td>
    <td>${d.freq[page]} (${d.char_freq})</td>
    <td>${d.examples.join("")}</td>
    <td>${d.comment}</td>
    </tr></tbody></table>`;

  document.getElementById("detail_content").innerHTML = table;
  document.getElementById("detail").style.display = "flex";
}

function hideDetail() {
  document.getElementById("detail").style.display = "none";
}

function showHelp() {
  document.getElementById("help_msg").style.display = "flex";
}

function hideHelp() {
  document.getElementById("help_msg").style.display = "none";
}

function createKeyboard() {
  let keyboard = "";
  let rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];

  for (let i = 0; i < rows.length; ++i) {
    keyboard += `<table><thead><tr id="th_${i + 1}" class="row_key">`;

    for (let l of rows[i]) {
      keyboard += `<th id="key_${l}">`;
      keyboard += `<span id="letter_${l}" class="letter">${l}</span>`;
      keyboard += '</th>';
    }
    keyboard += `</tr></thead><tbody><tr id="tr_${i + 1}" class="row_root">`;

    for (let l of rows[i]) {
      keyboard += "<td>";

      if (chart_json[l]) {
        // 键帽内字根跨编码组按覆盖字频率（char_freq）全局降序，与详情弹窗
        // 「字频排名」同口径、全局固定；freq[page] > 0 && visible(...) 只用于
        // 过滤当前字集档位下是否有字，不参与排序。
        let roots = [];
        for (let c of Object.keys(chart_json[l])) {
          for (let r of Object.keys(chart_json[l][c])) {
            let d = chart_json[l][c][r];
            if (d.freq[page] > 0 && visible(l, c, r)) roots.push({ r, c, d });
          }
        }
        roots.sort((a, b) => rootFreq(b.d) - rootFreq(a.d) ||
                             a.r.localeCompare(b.r, "zh"));

        for (let it of roots) {
          let d = it.d;
          let clz = "root";
          if (d.traditional) clz += " traditional";
          clz += rootClass(d);
          keyboard += `<span class="${clz}" data-letter="${l}" data-code="${it.c}" data-root="${it.r}" onclick="showDetail(this)">${mr(it.r)}</span>`;
          // 编码组被打散后，小徽章改为每个字根自带（第二位键位字母）
          if (it.c.length > 1) {
            keyboard += `<span class="code">${it.c.substring(1)}</span>`;
          }
          keyboard += " ";
        }
      }

      keyboard += '</td>';
    }

    keyboard += '</tr></tbody></table>';
  }

  return keyboard;
}

// 字根清单表已下线：页面只保留键盘字根图，单根详情仍由 showDetail() 弹窗呈现。

window.onload = function() {
  // 默认不显示繁体/罕用字根：有清单才给开关，图例等勾选后再出
  if (!hasMarkedRoots()) {
    document.getElementById("d_trad").style.display = "none";
  }
  document.getElementById("s_freq").innerHTML = createFreqSelectBox();
  computeRootsRank();
  onChangeFreq(0);
}

</script>
