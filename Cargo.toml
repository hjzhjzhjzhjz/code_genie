[package]
name = "code_genie"
version = "0.1.0"
edition = "2024"
# MSRV 跟随最新 stable：1.100.0（2026-11-12）。let chains 自 1.88 稳定、edition 2024 需 1.85，
# 均已不构成下限。抬高后 Cargo 的 MSRV 感知解析器不再把依赖压回旧版；
# 且下面的 [lints.cargo] unused_dependencies 需要 Cargo 1.100+ 才生效。
rust-version = "1.100"
# benches/ 由下面的 [[bench]] 显式声明，避免自动发现把同一文件再编一遍。
autobenches = false

# Cargo 1.100 起自带 lint 系统：把「未用依赖」从默认 warn 提升为 deny，
# 防止再出现 hashbrown 0.14 那种源码无引用却长期挂着的 crate。
# 注意只对 [dependencies] 生效，dev-dependencies 不受检查。
[lints.cargo]
unused_dependencies = "deny"

[features]
default = ["mimalloc"]
# 全局分配器。关掉（`--no-default-features`）即回退系统分配器，便于 A/B 对比。
mimalloc = ["dep:mimalloc"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
rand = "0.10"
rayon = "1.10"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
smallvec = "1"
# 全局分配器：SA 每步都有大量短命分配，Windows/mingw 的堆段只扩不缩，
# 长跑时私有内存与页文件峰值会持续抬高。mimalloc 用线程本地堆 + 更积极的页回收，
# 目标是压住这条高水位曲线（可选依赖，见 [features]）。
mimalloc = { version = "0.1", optional = true }
ron = "0.12"
# 配置文件同时支持 RON 与 TOML（加载器按扩展名优先、另一格式兜底）
toml = "1"

[dev-dependencies]
divan = "0.1.21"
proptest = { version = "1", default-features = false, features = ["std"] }
# 仅测试用：任意精度「真值」基准，用于量化 f64 增量累加器的长跑漂移。
# 只开 floats（会传递启用 rationals / naturals_and_integers）+ std，不进发布二进制。
# 注意 malachite 是 LGPL-3.0-only；挂 dev-dependencies 才不会把许可证义务带进产物。
malachite = { version = "0.14", default-features = false, features = ["floats", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Profiling 专用：继承 release 的优化，但保留调试符号以便火焰图/采样器解析函数名。
# panic = "unwind" 让部分采样器（dtrace/Instruments）回溯更稳。仅用于性能分析，不影响 release。
[profile.profiling]
inherits = "release"
debug = true
panic = "unwind"

[[bin]]
name = "code_genie"
path = "src/main.rs"

# 退火热点微基准（divan，自带 harness）。
# 用 #[path] 在 bench crate 内重建模块树，无需 lib target、无需改动 src/main.rs。
[[bench]]
name = "annealing_hotspots"
path = "benches/退火热点.rs"
harness = false
