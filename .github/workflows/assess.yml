name: 宇浩测评

on:
  # 退火优化跑完 → 自动对比该轮所有线程的码表
  workflow_run:
    workflows: ["CodeGenie 退火优化"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 要对比的 optimize 运行 id（留空则测评下面给定的 keymap）
        required: false
        default: ""
        type: string
      keymap:
        description: 键位映射文件（仓库内路径，仅 run_id 为空时用）
        required: false
        default: runs/r2s1实分-s3-键位表.txt
        type: string

permissions:
  contents: read
  actions: read

jobs:
  assess:
    name: 测评与对比
    # 优化失败就不测了
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出 code_genie
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 全链路纯 Rust、零 Node：测评内核（assess_core）为原生实现。所需数据
      # （字频/字集/当量/区块/语料）已全部纳入本仓 yuhao-data/，
      # 无需 checkout yuhao-assess，也无需装 pnpm/Node 或联网下载。
      - name: 校验测评数据
        run: |
          set -e
          ls -1 yuhao-data/*.json | head
          test -f yuhao-data/equivTable.json
          test -f yuhao-data/cjkBlocks.json
          test -f yuhao-data/literature.txt
          echo "测评数据齐备（本仓 yuhao-data/）"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log | tail -n 5; then
            echo "=== 编译错误 ==="
            grep -E -A 14 '^error' build.log || tail -n 80 build.log
            exit 1
          fi

      # 拆分全表.txt / 字根约束.txt 等是 `code_genie prepare` 的产物，不入库，用前必须先重建。
      # 注意：prepare 的产物目录 moling/ 同样不入库，本步需先自建，否则二进制里裸 fs::write
      # 会因父目录不存在而 ENOENT（优化流水线里该步有 files_dir=='moling' 守卫、默认 '.' 故被跳过，不受影响）。
      - name: 生成码灵输入文件（code_genie prepare）
        run: |
          set -euo pipefail
          mkdir -p moling
          ./target/release/code_genie prepare --dir moling

      # assess 内部要加载 config.ron（取 keys.allowed 等参数）。按 config.ron.example
      # 生成一份，[files] 指向 moling/ 下的真实产物；full_splits 在 example 里已带 moling/ 前缀。
      - name: 生成 config.ron
        run: |
          python3 - <<'PY'
          import pathlib, re
          cfg = pathlib.Path("config.ron.example").read_text(encoding="utf-8")
          for name in ["fixed", "splits", "pair_equiv", "key_dist"]:
              cfg = re.sub(rf'(?m)^(\s*{name}:\s*")([^"]*)(")', rf'\g<1>moling/\g<2>\g<3>', cfg)
          pathlib.Path("config.ron").write_text(cfg, encoding="utf-8")
          print("config.ron 已生成（[files] 指向 moling/）")
          PY

      # ---- 手动模式：只测给定的一份码表 ----
      - name: 准备码表（直接用 optimize 产出的 完整码表.txt）
        if: github.event_name == 'workflow_dispatch' && inputs.run_id == ''
        env:
          KEYMAP: ${{ inputs.keymap }}
        run: |
          set -euo pipefail
          mkdir -p out-assess
          # optimize 收尾已产出「简码置顶 + 全码段」的完整码表，与 keymap 同目录。
          cp "$(dirname "$KEYMAP")/完整码表.txt" out-assess/完整码表.txt
          wc -l < out-assess/完整码表.txt

      - name: 跑测评（单表）
        if: github.event_name == 'workflow_dispatch' && inputs.run_id == ''
        run: |
          set -e
          ./target/release/code_genie assess \
            --dir out-assess \
            --file-name 完整码表.txt \
            --scheme 测评方案.jsonc \
            --yuhao-dir yuhao-data \
            --keep out-assess/结果 \
            --summary 汇总.md \
            --profile 方案档案
          if [ -f 汇总.md ]; then cat 汇总.md >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::没有生成汇总表（可能没找到码表）"; fi

      # ---- 自动/对比模式：拉整轮所有分片产物一起测 ----
      - name: 下载优化产物
        if: github.event_name == 'workflow_run' || inputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: codegenie-*
          path: artifacts
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: 跑测评（对比整轮）
        if: github.event_name == 'workflow_run' || inputs.run_id != ''
        run: |
          echo "### 参与对比的码表" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find artifacts -name 完整码表.txt | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ./target/release/code_genie assess \
            --dir artifacts \
            --file-name 完整码表.txt \
            --scheme 测评方案.jsonc \
            --yuhao-dir yuhao-data \
            --keep artifacts/结果 \
            --summary 汇总.md \
            --profile 方案档案
          if [ -f 汇总.md ]; then cat 汇总.md >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::没有生成汇总表（可能没找到码表）"; fi

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: assess-run${{ github.run_number }}
          path: |
            out-assess/
            artifacts/
            方案档案/
            汇总.md
          if-no-files-found: warn
          retention-days: 14
