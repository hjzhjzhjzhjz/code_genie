name: 宇浩测评

on:
  # 退火优化跑完 → 自动对比该轮所有线程的码表
  workflow_run:
    workflows: ["CodeGenie 退火优化"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 要对比的 optimize 运行 id（留空则测评下面给定的 keymap）
        required: false
        default: ""
        type: string
      pipeline_chars:
        description: 拆分流水线要查看的字（空格分隔）
        required: false
        default: "的 一 是 想"
        type: string
      merges:
        description: 归并规则，一行一个变体；写法 `A=B` 或 `A 1=B 2`
        required: false
        default: |
          勹=白
          丶 2=白 2
        type: string
      keymap:
        description: 键位映射文件（仓库内路径，仅 run_id 为空时用）
        required: false
        default: runs/s4-export/output-keymap.txt
        type: string
      simple:
        description: 简码表（仓库内路径，可留空）
        required: false
        default: runs/s4-export/output-simple-codes.txt
        type: string

permissions:
  contents: read
  actions: read

jobs:
  assess:
    name: 测评与对比
    # 优化失败就不测了
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出 code_genie
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 检出 yuhao-assess
        uses: actions/checkout@v7
        with:
          repository: forfudan/yuhao-assess
          path: yuhao-assess
          fetch-depth: 1

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装测评器依赖
        working-directory: yuhao-assess
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tail -n 5

      - name: 准备测评数据
        run: |
          mkdir -p yuhao-assess/public/data yuhao-assess/public/texts
          cp yuhao-data/*.json yuhao-assess/public/data/
          cp yuhao-data/literature.txt yuhao-assess/public/texts/literature.txt
          ls -1 yuhao-assess/public/data
          wc -c < yuhao-assess/public/texts/literature.txt

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log | tail -n 5; then
            echo "=== 编译错误 ==="
            grep -E -A 14 '^error' build.log || tail -n 80 build.log
            exit 1
          fi

      # 拆分全表.txt / 字根约束.txt 等是 `code_genie prepare` 的产物，不入库，用前必须先重建。
      - name: 生成码灵输入文件（code_genie prepare）
        run: |
          set -euo pipefail
          ./target/release/code_genie prepare --dir moling

      # assess 内部要加载 config.ron（取 keys.allowed 等参数）。按 config.ron.example
      # 生成一份，[files] 指向 moling/ 下的真实产物；full_splits 在 example 里已带 moling/ 前缀。
      - name: 生成 config.ron
        run: |
          python3 - <<'PY'
          import pathlib, re
          cfg = pathlib.Path("config.ron.example").read_text(encoding="utf-8")
          for name in ["fixed", "dynamic", "splits", "pair_equiv", "key_dist"]:
              cfg = re.sub(rf'(?m)^(\s*{name}:\s*")([^"]*)(")', rf'\g<1>moling/\g<2>\g<3>', cfg)
          pathlib.Path("config.ron").write_text(cfg, encoding="utf-8")
          print("config.ron 已生成（[files] 指向 moling/）")
          PY

      # ---- 手动模式：只测给定的一份码表 ----
      - name: 导出码表
        if: github.event_name == 'workflow_dispatch' && inputs.run_id == ''
        env:
          KEYMAP: ${{ inputs.keymap }}
          SIMPLE: ${{ inputs.simple }}
        run: |
          mkdir -p out-assess
          ARG=""
          if [ -n "$SIMPLE" ]; then ARG="--simple $SIMPLE"; fi
          ./target/release/code_genie export \
            --keymap "$KEYMAP" --chaifen moling/拆分全表.txt $ARG \
            --output out-assess/全码表.txt
          wc -l < out-assess/全码表.txt

      - name: 跑测评（单表）
        if: github.event_name == 'workflow_dispatch' && inputs.run_id == ''
        run: |
          set -e
          ./target/release/code_genie assess \
            --dir out-assess \
            --scheme codegenie-s4.jsonc \
            --yuhao-dir yuhao-assess \
            --keep out-assess/结果 \
            --summary 汇总.md \
            --profile 方案档案
          if [ -f 汇总.md ]; then cat 汇总.md >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::没有生成汇总表（可能没找到码表）"; fi

      # ---- 自动/对比模式：拉整轮所有分片产物一起测 ----
      - name: 下载优化产物
        if: github.event_name == 'workflow_run' || inputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: codegenie-*
          path: artifacts
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: 跑测评（对比整轮）
        if: github.event_name == 'workflow_run' || inputs.run_id != ''
        run: |
          echo "### 参与对比的码表" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find artifacts -name 全码表.txt | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ./target/release/code_genie assess \
            --dir artifacts \
            --scheme codegenie-s4.jsonc \
            --yuhao-dir yuhao-assess \
            --keep artifacts/结果 \
            --summary 汇总.md \
            --profile 方案档案
          if [ -f 汇总.md ]; then cat 汇总.md >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::没有生成汇总表（可能没找到码表）"; fi

      - name: 拆分流水线与归并
        if: github.event_name == 'workflow_dispatch' && inputs.run_id == ''
        env:
          CHARS: ${{ inputs.pipeline_chars }}
          MERGES: ${{ inputs.merges }}
        run: |
          set -e
          K=runs/s4-export/output-keymap.txt
          C=moling/拆分全表.txt
          S=runs/s4-export/output-simple-codes.txt
          ./target/release/code_genie pipeline --keymap "$K" --chaifen "$C" --simple "$S" \
            --fixed moling/字根约束.txt --chars "$CHARS" --top 5 --output 流水线.md
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(--rules "$line")
          done <<< "$MERGES"
          if [ ${#args[@]} -gt 0 ]; then
            ./target/release/code_genie merge --keymap "$K" --chaifen "$C" --simple "$S" \
              "${args[@]}" --out 归并对比 --summary 归并.md
            cat 归并.md >> "$GITHUB_STEP_SUMMARY"
          fi
          cat 流水线.md >> "$GITHUB_STEP_SUMMARY"

      - name: 形码测评诊断
        run: |
          set -e
          if [ -d artifacts ]; then TARGET=artifacts; else TARGET=out-assess; fi
          ./target/release/code_genie diagnose \
            --dir "$TARGET" \
            --data ceping-data \
            --summary 诊断.md
          if [ -f 诊断.md ]; then cat 诊断.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 补连续文本当量
        run: |
          set -e
          shopt -s nullglob
          cp fill-continuous.mts yuhao-assess/scripts/
          if [ ! -d 方案档案 ]; then
            echo "::warning::没有方案档案，跳过"
            exit 0
          fi
          for f in 方案档案/*.json; do
            echo "── $f"
            (cd yuhao-assess && pnpm tsx \
              scripts/fill-continuous.mts --profile "../$f")
          done

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assess-run${{ github.run_number }}
          path: |
            out-assess/
            artifacts/
            方案档案/
            汇总.md
            诊断.md
            流水线.md
            归并.md
            归并对比/
          if-no-files-found: warn
          retention-days: 14
