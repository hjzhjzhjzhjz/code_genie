name: 整句测评

on:
  workflow_dispatch:
    inputs:
      keymap:
        description: 键位映射文件（仓库内路径）
        required: false
        default: runs/s4-export/output-keymap.txt
        type: string
      simple:
        description: 简码表（仓库内路径，可留空）
        required: false
        default: runs/s4-export/output-simple-codes.txt
        type: string
      limit:
        description: 最多测多少句（0 = 全部）
        required: false
        default: "0"
        type: string
      max_len:
        description: 句长上限
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  sentence:
    name: 整句准确率
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译 code_genie
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log | tail -n 5; then
            echo "=== 编译错误 ==="
            grep -E -A 14 '^error' build.log || tail -n 80 build.log
            exit 1
          fi

      - name: 生成方案包
        env:
          KEYMAP: ${{ inputs.keymap }}
          SIMPLE: ${{ inputs.simple }}
        run: |
          set -e
          ./target/release/code_genie rime \
            --keymap "$KEYMAP" --chaifen moling/chaifen-all.txt \
            --simple "$SIMPLE" --words ceping-data/词表.txt \
            --out rime-pkg --id xingyun --name 星云
          echo "--- 词典规模 ---"
          for f in rime-pkg/xingyun.full.dict.yaml rime-pkg/xingyun.words.dict.yaml; do
            echo "$f: $(grep -c $'\t' "$f") 条"
          done

      - name: 跑整句测评
        env:
          LIMIT: ${{ inputs.limit }}
          MAXLEN: ${{ inputs.max_len }}
        run: |
          set -o pipefail
          ./target/release/code_genie sentence \
            --full-dict rime-pkg/xingyun.full.dict.yaml \
            --words-dict rime-pkg/xingyun.words.dict.yaml \
            --corpus yuhao-text/literature.txt \
            --limit "$LIMIT" --max-len "$MAXLEN" \
            --dump 整句中间 \
            --out 整句.md 2>&1 | tee sentence.log
          echo "--- 摘要 ---"
          cat 整句.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 整句测评
          path: |
            整句.md
            sentence.log
            整句中间/
            rime-pkg/
          if-no-files-found: warn
