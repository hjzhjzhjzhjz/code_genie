name: 整句测评

on:
  workflow_dispatch:
    inputs:
      full_dict:
        description: 全码词典（Rime dict.yaml；用 rime-convert 产出后填路径）
        required: true
        default: rime-pkg/yuhao/starmoon.full.dict.yaml
        type: string
      short_dict:
        description: 简码词典（可留空）
        required: false
        default: rime-pkg/yuhao/starmoon_sc.short.dict.yaml
        type: string
      words_dict:
        description: 词组词典（可留空）
        required: false
        default: rime-pkg/yuhao/starmoon_sc.words.dict.yaml
        type: string
      limit:
        description: 最多测多少句（0 = 全部）
        required: false
        default: "0"
        type: string
      max_len:
        description: 句长上限
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  sentence:
    name: 整句准确率
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译 code_genie
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log | tail -n 5; then
            echo "=== 编译错误 ==="
            grep -E -A 14 '^error' build.log || tail -n 80 build.log
            exit 1
          fi

      - name: 检查词典
        env:
          FULL: ${{ inputs.full_dict }}
          SHORT: ${{ inputs.short_dict }}
          WORDS: ${{ inputs.words_dict }}
        run: |
          set -e
          for f in "$FULL" "$SHORT" "$WORDS"; do
            if [ -z "$f" ]; then
              continue
            fi
            if [ ! -f "$f" ]; then
              echo "::error::词典不存在: $f（先用 rime-convert 生成方案包）"
              exit 1
            fi
            echo "$f: $(grep -c $'\t' "$f") 条"
          done

      - name: 跑整句测评
        env:
          FULL: ${{ inputs.full_dict }}
          SHORT: ${{ inputs.short_dict }}
          WORDS: ${{ inputs.words_dict }}
          LIMIT: ${{ inputs.limit }}
          MAXLEN: ${{ inputs.max_len }}
        run: |
          set -o pipefail
          ARGS="--full-dict $FULL --corpus yuhao-text/literature.txt --limit $LIMIT --max-len $MAXLEN --dump 整句中间 --out 整句.md"
          if [ -n "$SHORT" ]; then ARGS="$ARGS --short-dict $SHORT"; fi
          if [ -n "$WORDS" ]; then ARGS="$ARGS --words-dict $WORDS"; fi
          ./target/release/code_genie sentence $ARGS 2>&1 | tee sentence.log
          echo "--- 摘要 ---"
          cat 整句.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 整句测评
          path: |
            整句.md
            sentence.log
            整句中间/
            rime-pkg/
          if-no-files-found: warn
