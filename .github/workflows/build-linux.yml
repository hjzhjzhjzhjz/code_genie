name: 编译 Linux 完整版

# 手动触发：编译 release 全功能二进制（单一 bin 含全部子命令），
# 连同宇浩测评（yuhao-assess 源码 + 数据）与全部运行数据打包成 zip，
# 供下载后在 Linux 上直接使用。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要编译的分支或 tag
        required: true
        default: moling
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 编译并打包（linux x86_64，含宇浩测评）
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出 code_genie
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: 检出宇浩测评
        uses: actions/checkout@v7
        with:
          repository: forfudan/yuhao-assess
          path: yuhao-assess
          fetch-depth: 1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译（release：LTO + codegen-units=1，单一二进制含全部功能）
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log | tail -n 5; then
            echo "=== 编译错误 ==="
            grep -E -A 14 '^error' build.log || tail -n 80 build.log
            exit 1
          fi
          strip target/release/code_genie
          ls -lh target/release/code_genie

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 生成 config.ron（新版无配置直接退出，冒烟与包内共用）
        run: |
          python3 - <<'PY'
          import pathlib, re
          cfg = pathlib.Path("config.ron.example").read_text(encoding="utf-8")
          for name in ["fixed", "splits"]:
              cfg = re.sub(rf'(?m)^(\s*{name}:\s*")([^"]*)(")',
                           rf'\g<1>moling/\g<2>\g<3>', cfg)
          # 当量/用指分布：prepare 不再产出这两份文件，留空走内嵌表
          cfg = cfg.replace('"pair_equivalence.txt"', '""')
          cfg = cfg.replace('"key_distribution.txt"', '""')
          pathlib.Path("config.ron").write_text(cfg, encoding="utf-8")
          print("config.ron 已生成（[files] 指向 moling/）")
          PY

      # 字根约束/单字拆分/字根声韵 等是 `code_genie prepare` 的产物，不入库，
      # 打包与后续步骤需要它们，必须先重建。原先的 moling/prepare-inputs.sh（bash + 内嵌 Perl）
      # 已由 Rust 子命令取代，路径不再要求先 cd 到 moling/。
      - name: 生成码灵输入文件（code_genie prepare）
        run: |
          set -euo pipefail
          ./target/release/code_genie prepare --dir moling 2>&1 | tee prepare-inputs.log
          echo "--- 产物校验 ---"
          for f in 字根约束.txt 单字拆分.txt 字根声韵.txt; do
            [ -s "moling/$f" ] || { echo "❌ $f 缺失或为空"; exit 1; }
          done
          sha256sum moling/字根约束.txt \
                    moling/单字拆分.txt moling/字根声韵.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 功能冒烟（全子命令 + 真实数据跑通取码链路）
        run: |
          set -e
          CG=./target/release/code_genie
          echo "--- 版本 ---"
          $CG --version
          echo "--- 子命令清单（应含全部功能）---"
          $CG --help
          echo "--- 取码链路冒烟（真实数据）---"
          $CG pipeline \
            --keymap runs/s4-export/output-keymap.txt \
            --chaifen moling/拆分全表.txt \
            --chars "的 一" --output /tmp/流水线.md
          wc -l < /tmp/流水线.md

      - name: 优化冒烟（内嵌当量/用指分布 + 5000 步）
        run: |
          set -e
          sed 's/2000000/5000/; s/threads: 12/threads: 2/' config.ron > /tmp/tiny.ron
          ./target/release/code_genie -c /tmp/tiny.ron optimize -d /tmp/tiny-out 2>&1 | tail -n 8
          test -s /tmp/tiny-out/字根键位表.txt
          echo "优化冒烟 OK"

      - name: 打包（二进制 + 数据 + 宇浩测评 + 一键脚本 + 说明）
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess

          commit = subprocess.run(["git", "rev-parse", "--short", "HEAD"],
                                  capture_output=True, text=True).stdout.strip()
          bdate = subprocess.run(["date", "-u", "+%Y-%m-%d"],
                                 capture_output=True, text=True).stdout.strip()
          ver = subprocess.run(["./target/release/code_genie", "--version"],
                               capture_output=True, text=True).stdout.strip()

          pkg = pathlib.Path("code_genie-linux-x86_64")
          shutil.rmtree(pkg, ignore_errors=True)
          pkg.mkdir()

          shutil.copy2("target/release/code_genie", pkg / "code_genie")
          os.chmod(pkg / "code_genie", 0o755)

          required = ["moling/字根约束.txt",
                      "moling/单字拆分.txt", "moling/字根声韵.txt",
                      "moling/拆分全表.txt",
                      "codegenie-s4.jsonc"]
          missing = [f for f in required if not pathlib.Path(f).exists()]
          if missing:
              raise SystemExit("缺少打包所需文件（应在 code_genie prepare 步骤生成）："
                               + ", ".join(missing))

          for f in required:
              dst = pkg / f
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(f, dst)

          shutil.copytree("yuhao-data", pkg / "yuhao-data")

          # 宇浩测评：源码（不含 .git），并把测评数据放进它的 public/
          shutil.copytree("yuhao-assess", pkg / "yuhao-assess",
                          ignore=shutil.ignore_patterns(".git*", "node_modules"))
          (pkg / "yuhao-assess" / "public" / "data").mkdir(parents=True, exist_ok=True)
          (pkg / "yuhao-assess" / "public" / "texts").mkdir(parents=True, exist_ok=True)
          for j in pathlib.Path("yuhao-data").glob("*.json"):
              shutil.copy2(j, pkg / "yuhao-assess" / "public" / "data" / j.name)
          shutil.copy2("yuhao-data/literature.txt",
                       pkg / "yuhao-assess" / "public" / "texts" / "literature.txt")

          shutil.copy2("config.ron", pkg / "config.ron")

          准备 = """#!/usr/bin/env bash
          # 宇浩测评环境准备：需要 Node.js 22+ 与 pnpm 9（npm i -g pnpm@9）
          set -e
          cd "$(dirname "$0")"
          command -v node >/dev/null || { echo "❌ 缺 Node.js 22+"; exit 1; }
          command -v pnpm >/dev/null || { echo "❌ 缺 pnpm 9（npm i -g pnpm@9）"; exit 1; }
          cd yuhao-assess
          pnpm install --frozen-lockfile
          echo "✅ 宇浩测评环境就绪"
          """
          (pkg / "宇浩测评-准备.sh").write_text(准备.replace("          ", "") , encoding="utf-8")

          跑 = """#!/usr/bin/env bash
          # 一键宇浩测评：bash 宇浩测评.sh [输出目录]（默认 out-assess）
          set -e
          cd "$(dirname "$0")"
          DIR="${1:-out-assess}"
          [ -d yuhao-assess/node_modules ] || bash 宇浩测评-准备.sh
          mkdir -p "$DIR"
          ./code_genie assess \\
            --dir "$DIR" \\
            --scheme codegenie-s4.jsonc \\
            --yuhao-dir yuhao-assess \\
            --keep "$DIR/结果" \\
            --summary "$DIR/汇总.md" \\
            --profile "$DIR/方案档案" 2>&1 | tee "$DIR/assess.log"
          echo "✅ 完成：$DIR/汇总.md"
          """
          (pkg / "宇浩测评.sh").write_text(跑.replace("          ", ""), encoding="utf-8")

          lines = [
              "code_genie Linux 完整版（含宇浩测评）",
              "================================",
              f"{ver}",
              f"构建：{commit}（{bdate}，Ubuntu 24.04，release + LTO，单一二进制含全部功能）",
              "",
              "运行要求",
              "  Linux x86_64；glibc 较新（≥ 2.39，Ubuntu 22.04/24.04、近两年的发行版均可）。",
              "  宇浩测评另需 Node.js 22+ 与 pnpm 9（仅测评需要，其余功能零依赖）。",
              "  如需在更老系统上跑，可再出 musl 静态版。",
              "",
              "快速开始",
              "  chmod +x code_genie 宇浩测评*.sh",
              "  ./code_genie --help                     查看全部子命令",
              "  ./code_genie -c config.ron optimize -d out",
              "                                          退火优化（改 config.ron 的",
              "                                          [annealing] threads / total_steps）",
              "  中途按 Ctrl-C 会写 checkpoint，之后",
              "  ./code_genie optimize --resume -d out   断点续算",
              "  optimize 收尾会自动产出 out/完整码表.txt（简码置顶 + 全码段），",
              "                                          测评直接用它，无需另行导出码表",
              "  字根图页面不再随 optimize 自动产出，需要时单独跑 chart：",
              "  ./code_genie chart -d out              生成字根键位图（单页 HTML）",
              "                                          out/ 需含 output-keymap.txt / 拆分全表.txt / 全字频表.txt",
              "                                          inputs/单字拆分-星陈-*.txt 提供真实拆分，缺失时全码退回补齐四码串",
              "",
              "宇浩测评（一键）",
              "  先把要测的码表放进一个目录（如 out/完整码表.txt），然后",
              "  bash 宇浩测评.sh out",
              "  结果：out/汇总.md（五套字频速度/码长、选重、方案档案）",
              "  首次会自动 pnpm install（bash 宇浩测评-准备.sh 可单独执行）",
              "",
              "子命令一览",
              "  optimize   模拟退火优化（核心）",
              "  encode     编码 / 导出测评码表（-c 拆分全表）",
              "  chart      字根键位图（HTML，需手动执行）",
              "  assess     宇浩测评对比（yuhao-assess 已含在包内）",
              "  rime-convert  以星月方案包为底包只换码",
              "  pipeline   取码推导 / 归并对比（--rules）",
              "  sentence   整句准确率（语料：yuhao-assess/public/texts/literature.txt）",
              "",
              "数据目录",
              "  moling/          prepare 产物（字根约束/单字拆分/字根声韵/拆分全表）",
              "  yuhao-data/      prepare 输入（星摩/字集字典）与宇浩测评数据源",
              "  yuhao-assess/    宇浩测评 CLI 源码与数据（public/ 已含测评数据与语料；",
              "                   node_modules 首次 pnpm install 生成）",
          ]
          (pkg / "说明.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("包内容（顶层）：")
          for p in sorted(pkg.iterdir()):
              print("  " + ("目录 " if p.is_dir() else "文件 ") + p.name)
          PY
          zip -qr code_genie-linux-x86_64.zip code_genie-linux-x86_64
          ls -lh code_genie-linux-x86_64.zip

      - name: 宇浩测评端到端冒烟（临时副本装依赖，包内保持干净）
        run: |
          set -e
          pnpm --version
          rm -rf /tmp/yh && cp -r code_genie-linux-x86_64/yuhao-assess /tmp/yh
          (cd /tmp/yh && pnpm install --frozen-lockfile 2>&1 | tail -n 3)
          mkdir -p /tmp/assess-dir
          # 优化冒烟已产出 /tmp/tiny-out/完整码表.txt（简码置顶 + 全码段）
          cp /tmp/tiny-out/完整码表.txt /tmp/assess-dir/
          ./target/release/code_genie -c config.ron assess \
            --dir /tmp/assess-dir \
            --file-name 完整码表.txt \
            --scheme codegenie-s4.jsonc \
            --yuhao-dir /tmp/yh \
            --summary /tmp/测评.md
          echo "--- 测评摘要 ---"
          head -n 24 /tmp/测评.md

      - name: 包内二进制冒烟
        run: |
          cd code_genie-linux-x86_64
          ./code_genie --version
          ./code_genie --help | head -n 8

      - name: 上传结果
        uses: actions/upload-artifact@v7
        with:
          name: codegenie-linux-x86_64
          path: code_genie-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 30
