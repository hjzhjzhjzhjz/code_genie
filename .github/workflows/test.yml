name: 测试与静态检查

# 每次推送/PR 都跑格式、Clippy、单元与属性测试。
# 与 build.yml（只出二进制）互补：这里不产出产物，只保证「改完不回归」。

on:
  push:
    branches: [moling, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  floor:
    name: 质量红线（diff 扫描）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出（需要完整历史才能找共同祖先）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 确定比较基准
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            # 新分支或强推时 before 可能是全零 / 不可达，退回上一个提交
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: 执行底线扫描
        run: python3 tools/检查红线.py --base "${{ steps.base.outputs.base }}"

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "### 质量红线"
            echo ""
            echo "对比基准：\`${{ steps.base.outputs.base }}\`"
            echo ""
            echo "底线见 \`CONSTRAINTS.md\`；门槛被放宽、测试被删、抑制注释新增都会拦在这里。"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: 依赖漏洞（cargo audit）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 原先用 rustsec/audit-check@v2.0.0：它仍声明 node20（上游 main 已改 node24
      # 但未发版），每次运行留一条弃用注解；内部又是 cargo install 从源码编译，
      # 白等两分半。改成装预编译的 cargo-audit 自己跑：行为等价（同样读 Cargo.lock
      # 与 RustSec 公告库、同样在漏洞时失败），注解干净，还能用 .cargo/audit.toml
      # 显式声明哪些 informational warning 可以忽略、理由写在同一处。
      - name: 安装 cargo-audit（预编译二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: 审计 Cargo.lock
        id: audit
        run: |
          set -o pipefail
          if ! cargo audit 2>&1 | tee audit.log; then
            echo "::error::发现依赖漏洞，见下方输出"
            exit 1
          fi
          # 只有 unmaintained / unsound / notice 这类 informational warning 时退出码
          # 仍是 0。单独数一下写进摘要，免得「有几个告警」被淹没在日志里。
          echo "warn_count=$(grep -c '^warning:' audit.log || true)" >> "$GITHUB_OUTPUT"

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "### 依赖漏洞审计"
            echo ""
            echo "| 项 | 结果 |"
            echo "| --- | --- |"
            echo "| cargo audit | ${{ steps.audit.outcome }} |"
            echo "| informational 告警 | ${{ steps.audit.outputs.warn_count }} |"
            echo ""
            echo '```'
            tail -n 40 audit.log 2>/dev/null || echo "（未跑到审计阶段）"
            echo '```'
            echo ""
            echo "白名单在 \`.cargo/audit.toml\`，每条必须写清来源链与风险面。"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: 格式 / Clippy / 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装 Rust（含 rustfmt、clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 依赖与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 格式检查
        id: fmt
        run: |
          set -o pipefail
          if ! cargo fmt --all --check 2>&1 | tee fmt.log; then
            echo "::error::代码未格式化，请本地执行 cargo fmt --all 后提交"
            head -n 80 fmt.log
            exit 1
          fi

      - name: Clippy（警告即错误）
        id: clippy
        run: |
          set -o pipefail
          if ! cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log; then
            echo "::error::Clippy 有告警或错误"
            grep -E -A 12 '^(error|warning)' clippy.log | head -n 120
            exit 1
          fi

      # chart 是可选 feature，默认构建根本碰不到它；不单独兜一次，那边坏了
      # 要等谁想起来 --features chart 才会发现。只编译不跑测试（测试在本地跑）。
      - name: Clippy（含 chart 图表 feature）
        id: chart
        run: |
          set -o pipefail
          if ! cargo clippy --all-targets --features chart -- -D warnings 2>&1 | tee chart.log; then
            echo "::error::--features chart 下 Clippy 有告警或错误"
            grep -E -A 12 '^(error|warning)' chart.log | head -n 120
            exit 1
          fi

      - name: 单元测试与属性测试
        id: test
        run: |
          set -o pipefail
          if ! cargo test --all-targets 2>&1 | tee test.log; then
            echo "=== 失败用例 ==="
            grep -E '^(test .* FAILED|---- .* stdout ----|thread .* panicked)' -A 12 test.log | head -n 160
            exit 1
          fi
          grep -E '^test result' test.log

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "### 检查结果"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "| --- | --- |"
            echo "| 格式（cargo fmt --check） | ${{ steps.fmt.outcome }} |"
            echo "| Clippy（-D warnings） | ${{ steps.clippy.outcome }} |"
            echo "| Clippy（--features chart） | ${{ steps.chart.outcome }} |"
            echo "| 测试（cargo test） | ${{ steps.test.outcome }} |"
            echo ""
            echo '```'
            grep -E '^test result' test.log 2>/dev/null || echo "（未跑到测试阶段）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
