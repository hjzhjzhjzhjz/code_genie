name: CodeGenie 退火优化

# 放在默认分支上，用 workflow_dispatch 手动触发。
# 代码从 inputs.ref 检出；配置以 inputs.config_base 为基础；输入文件从 inputs.files_dir 取。
#
# 续算只走播种（seed_run_id）：下载历史运行的 artifact，
# 取其 thread-*/字根键位表.txt 轮流播种，新一轮退火从这些解继续演化。
# repeat > 1 时一轮跑完接着播种下一轮，循环往复，直到轮数用完或时间预算耗尽。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要运行的代码分支或 tag
        required: true
        default: moling
        type: string
      config_base:
        description: 基础配置（仓库内路径，默认 config.ron.example）
        required: true
        default: config.ron.example
        type: string
      files_dir:
        description: 输入文件所在目录（. 表示仓库根目录）
        required: true
        default: "."
        type: string
      total_steps:
        description: total_steps（2 万步冒烟 / 200 万步 / 4000 万步）
        required: true
        default: "20000"
        type: string
      threads:
        description: 并行线程数（ubuntu-latest 是 4 vCPU）
        required: true
        default: "4"
        type: string
      shard_list:
        description: 分片列表（JSON 数组，[1] 表示不分片，[1,2,3,4] 表示四片并行）
        required: true
        default: "[1]"
        type: string
      mapping:
        description: 字根映射表（仓库内路径，留空则不套 PUA 显示字）
        required: false
        default: ""
        type: string
      out_dir:
        description: 输出目录名（同时作为 artifact 名的一部分）
        required: true
        default: out-smoke
        type: string
      seed_run_id:
        description: 播种：历史运行 id，用其 thread-*/字根键位表.txt（留空 = 全新随机起步）
        required: false
        default: ""
        type: string
      seed_shard:
        description: 播种来源分片号（留空 = 合并该运行全部分片）
        required: false
        default: ""
        type: string
      repeat:
        description: 重复轮数（每轮 total_steps 步；第 2 轮起自动播种上一轮的解，1-20）
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  optimize:
    name: 编译并运行模拟退火（分片 ${{ matrix.shard }}）
    runs-on: ubuntu-24.04
    # 单个分片不跑时不启动
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    concurrency:
      group: codegenie-${{ inputs.ref }}-${{ inputs.out_dir }}-s${{ matrix.shard }}
      cancel-in-progress: false
    # GitHub 单 job 硬上限 360 分钟，留 10 分钟余量给 artifact 上传
    timeout-minutes: 350
    env:
      OUT_DIR: ${{ inputs.out_dir }}
      TOTAL_STEPS: ${{ inputs.total_steps }}
      THREADS: ${{ inputs.threads }}
      CONFIG_BASE: ${{ inputs.config_base }}
      FILES_DIR: ${{ inputs.files_dir }}
      SEED_RUN: ${{ inputs.seed_run_id }}
      SEED_SHARD: ${{ inputs.seed_shard }}
      REPEAT: ${{ inputs.repeat }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: 校验播种参数
        run: |
          set -e
          if [ -n "$SEED_RUN" ] && ! echo "$SEED_RUN" | grep -qE '^[0-9]+$'; then
            echo "::error::seed_run_id 必须是数字: $SEED_RUN"
            exit 1
          fi
          if [ -n "$SEED_RUN" ]; then
            echo "参数校验通过（来源：历史播种 run $SEED_RUN）"
          else
            echo "参数校验通过（来源：全新随机）"
          fi

      - name: 下载播种来源
        if: ${{ inputs.seed_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p 历史
          列出() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts?per_page=100" \
              --paginate --jq '.artifacts[] | select(.expired == false) | .name'
          }

          if [ -n "$SEED_SHARD" ]; then
            names=$(列出 "$SEED_RUN")
            echo "--- 运行 $SEED_RUN 的 artifact ---"
            echo "$names"
            pick=$(echo "$names" | grep -- "-s$SEED_SHARD$" | head -n1 || true)
            if [ -z "$pick" ]; then
              echo "::error::运行 $SEED_RUN 里没有以 -s$SEED_SHARD 结尾的 artifact"
              exit 1
            fi
            echo "下载 $pick"
            gh run download "$SEED_RUN" -n "$pick" -D "历史/$pick"
          else
            for n in $(列出 "$SEED_RUN" | grep '^codegenie-' || true); do
              echo "下载 $n"
              gh run download "$SEED_RUN" -n "$n" -D "历史/$n"
            done
            if [ -z "$(ls -A 历史 2>/dev/null)" ]; then
              echo "::error::运行 $SEED_RUN 没有可下载的 codegenie-* artifact"
              exit 1
            fi
          fi

          # 老产物可能没有尺度文件；有就继承，跨运行口径一致
          for f in 历史/*/尺度.json; do
            if [ -f "$f" ]; then
              cp "$f" 尺度-来源.json
              echo "继承来源尺度: $f"
              break
            fi
          done

      - name: 准备播种目录
        if: ${{ inputs.seed_run_id != '' }}
        run: |
          set -e
          rm -rf seed
          mkdir -p seed
          i=0
          while IFS= read -r km; do
            nn=$(printf 'thread-%02d' "$i")
            mkdir -p "seed/$nn"
            cp "$km" "seed/$nn/字根键位表.txt"
            i=$((i+1))
          done < <(find 历史 -type f -path '*/thread-*/字根键位表.txt' | sort)
          if [ "$i" -eq 0 ]; then
            echo "::error::历史产物里没有 thread-*/字根键位表.txt，无法播种"
            exit 1
          fi
          echo "已收集 $i 个种子："
          ls -1 seed

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # files_dir=moling 时输入取 moling/ 下的文件，而 字根约束/
      # 单字拆分/字根声韵 等是 `code_genie prepare` 的产物、不入库，必须先重建，
      # 否则下游 src/main.rs 的 must() 会 exit(1)。原先的 prepare-inputs.sh 已由
      # Rust 子命令取代；这里用 cargo run 是因为本步早于后面的 cargo build。
      - name: 生成码灵输入文件（code_genie prepare）
        if: inputs.files_dir == 'moling'
        run: |
          set -euo pipefail
          cargo run --quiet --release -- prepare --dir moling 2>&1 | tee prepare-inputs.log
          for f in 字根约束.txt 单字拆分.txt 字根声韵.txt; do
            [ -s "moling/$f" ] || { echo "::error::$f 缺失或为空"; exit 1; }
          done

      - name: 生成 config.ron
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          steps = os.environ["TOTAL_STEPS"].strip()
          threads = os.environ["THREADS"].strip()
          files_dir = (os.environ.get("FILES_DIR") or ".").strip().rstrip("/")
          base = (os.environ.get("CONFIG_BASE") or "config.ron.example").strip()

          if not steps.isdigit() or int(steps) <= 0:
              sys.exit(f"total_steps 非法: {steps!r}")
          if not threads.isdigit() or int(threads) <= 0:
              sys.exit(f"threads 非法: {threads!r}")

          src = pathlib.Path(base)
          if not src.is_file():
              sys.exit(f"找不到基础配置: {base}")
          lines = src.read_text(encoding="utf-8").splitlines()

          FILE_KEYS = ("fixed", "splits", "full_splits", "pair_equiv", "key_dist")
          hit_steps, hit_threads, out = False, False, []
          for line in lines:
              # RON 无 [section] 头，total_steps/threads 全局唯一，直接匹配即可
              m = re.match(r"^(\s*total_steps:\s*)([0-9_]+)(.*)$", line)
              if m:
                  line = m.group(1) + steps + m.group(3)
                  hit_steps = True
              m = re.match(r"^(\s*threads:\s*)([0-9_]+)(.*)$", line)
              if m:
                  line = m.group(1) + threads + m.group(3)
                  hit_threads = True

              if files_dir not in ("", "."):
                  m = re.match(r'^(\s*(' + "|".join(FILE_KEYS) + r'):\s*")([^"]*)(")(.*)$', line)
                  # 空值不重写：full_splits: "" 表示「不生成完整码表」，不能被改成 "moling/"
                  # group(5) 保留行尾（RON 的逗号/注释），否则会丢逗号导致解析失败
                  if m and m.group(3):
                      name = os.path.basename(m.group(3).replace("\\", "/"))
                      line = f"{m.group(1)}{files_dir}/{name}{m.group(4)}{m.group(5)}"

              out.append(line)

          if not (hit_steps and hit_threads):
              sys.exit(f"未定位到 total_steps/threads（steps={hit_steps}, threads={hit_threads}）")

          pathlib.Path("config.ron").write_text("\n".join(out) + "\n", encoding="utf-8")
          print(f"config.ron 已生成：base={base} total_steps={steps} threads={threads} files_dir={files_dir}")
          PY
          echo "--- annealing ---"
          grep -nE '^\s*(threads|total_steps):' config.ron
          echo "--- files ---"
          grep -nE '^\s*(fixed|splits|full_splits|pair_equiv|key_dist):' config.ron || true
          echo "--- 输入文件 ---"
          for f in $(grep -E '^\s*(fixed|splits|full_splits|pair_equiv|key_dist):' config.ron | grep -oE '"[^"]+"' | tr -d '"'); do
            if [ -f "$f" ]; then
              echo "OK   $f ($(wc -c < "$f") bytes, $(wc -l < "$f") lines)"
            else
              echo "MISS $f"
            fi
          done

      - name: 编译（release + LTO）
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: 运行退火（repeat 轮，逐轮播种）
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          # 总时间预算：单 job 350 分钟上限，留足 artifact 上传与收尾
          BUDGET=$(( 295 * 60 ))
          if ! echo "$REPEAT" | grep -qE '^[0-9]+$'; then REPEAT=1; fi
          ROUNDS=$REPEAT
          [ "$ROUNDS" -lt 1 ] && ROUNDS=1
          [ "$ROUNDS" -gt 20 ] && ROUNDS=20
          echo "=== 计划：${ROUNDS} 轮 × total_steps=$TOTAL_STEPS，逐轮播种 ==="

          T0=$SECONDS
          for k in $(seq 1 "$ROUNDS"); do
            ARGS=()
            if [ "$k" -eq 1 ]; then
              if [ -n "$SEED_RUN" ]; then ARGS+=(--seed-dir seed); fi
              if [ -f "尺度-来源.json" ]; then ARGS+=(--scale 尺度-来源.json); fi
            else
              if ! ls "$OUT_DIR"/thread-*/字根键位表.txt >/dev/null 2>&1; then
                echo "::error::第 $((k-1)) 轮没有产出线程键位表，停止重复"
                break
              fi
              ARGS+=(--seed-dir "$OUT_DIR")
              if [ -f "$OUT_DIR/尺度.json" ]; then ARGS+=(--scale "$OUT_DIR/尺度.json"); fi
            fi

            LEFT=$(( BUDGET - (SECONDS - T0) ))
            SLICE=$(( LEFT / (ROUNDS - k + 1) ))
            if [ "$SLICE" -le 120 ]; then
              echo "::warning::时间预算不足，第 $k 轮起停止（已用 $((SECONDS - T0))s / ${BUDGET}s）"
              break
            fi

            echo ""
            if [ "${#ARGS[@]}" -gt 0 ]; then
              echo "▶️ 第 $k/$ROUNDS 轮（本轮时限 ${SLICE}s）播种: ${ARGS[*]}"
            else
              echo "▶️ 第 $k/$ROUNDS 轮（本轮时限 ${SLICE}s）全新随机"
            fi
            timeout --signal=INT --kill-after=60s "${SLICE}s" \
              ./target/release/code_genie -c config.ron optimize -d "$OUT_DIR" "${ARGS[@]}" 2>&1 | tee -a run.log \
              || echo "::warning::第 $k 轮被时限中断（exit=$?），本轮解已落盘，下一轮播种续算"

            # 本轮线程解已被下一轮吃进；清掉程序自动改名的旧版本，artifact 只留每轮最终态
            rm -f "$OUT_DIR"/*.txt.2* "$OUT_DIR"/thread-*/*.txt.2* 2>/dev/null || true
          done
          rm -f "$OUT_DIR"/*.txt.2* "$OUT_DIR"/thread-*/*.txt.2* 2>/dev/null || true
          echo "ACTUAL_ROUNDS=$k" >> "$GITHUB_ENV"
          echo "=== 重复运行结束：共 $k 轮 ==="

      - name: 生成字根表页面（完整分页）
        if: always()
        env:
          KEYMAP: ${{ inputs.out_dir }}/字根键位表.txt
          MAPPING: ${{ inputs.mapping }}
        run: |
          set -euo pipefail
          if [ ! -f "$KEYMAP" ]; then
            echo "::warning::没有 keymap，跳过字根表页面"
            exit 0
          fi
          # 产物直接落在 $OUT_DIR，上传清单已包含整个目录。
          # chart -d 要求齐备 output-keymap.txt / 拆分全表.txt / 全字频表.txt。
          # 拆分全表/全字频表按优先级取：moling/（prepare 产物）→ files_dir（随数据集入库）；
          # 都没有就跳过页面（不把整次 run 判为 failure）。
          cp "$KEYMAP" "$OUT_DIR/output-keymap.txt"
          CHART_SRC=""
          if [ -f "moling/拆分全表.txt" ] && [ -f "moling/全字频表.txt" ]; then
            CHART_SRC="moling"
          elif [ -f "$FILES_DIR/拆分全表.txt" ] && [ -f "$FILES_DIR/全字频表.txt" ]; then
            CHART_SRC="$FILES_DIR"
          fi
          if [ -z "$CHART_SRC" ]; then
            echo "::warning::缺 拆分全表.txt/全字频表.txt（moling/ 与 $FILES_DIR 均无），跳过字根表页面"
            exit 0
          fi
          cp "$CHART_SRC/拆分全表.txt" "$OUT_DIR/拆分全表.txt"
          cp "$CHART_SRC/全字频表.txt" "$OUT_DIR/全字频表.txt"
          if [ -n "$MAPPING" ] && [ -f "$MAPPING" ]; then
            cp "$MAPPING" "$OUT_DIR/roots-mapping.tsv"
          fi
          ./target/release/code_genie chart -d "$OUT_DIR"
          ls -l "$OUT_DIR"/*.html

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "### CodeGenie 退火结果"
            echo ""
            echo "- 分支：\`${{ inputs.ref }}\`"
            echo "- 配置基础：\`$CONFIG_BASE\`"
            echo "- 输入目录：\`$FILES_DIR\`"
            echo "- total_steps：\`$TOTAL_STEPS\`"
            echo "- 线程数：\`$THREADS\`"
            echo "- 输出目录：\`$OUT_DIR\`"
            if [ -n "$SEED_RUN" ]; then
              echo "- 播种来源：运行 \`$SEED_RUN\`（分片 ${SEED_SHARD:-全部}）"
            else
              echo "- 播种来源：无（全新随机）"
            fi
            echo "- 重复轮数：\`${REPEAT:-1}\`（实际 ${ACTUAL_ROUNDS:-1} 轮）"
            echo ""
            if [ -f "$OUT_DIR/汇总.txt" ]; then
              echo '```'
              head -n 20 "$OUT_DIR/汇总.txt"
              echo '```'
            else
              echo "未找到 \`$OUT_DIR/汇总.txt\`，运行可能未完成。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理中间产物
        if: always()
        run: |
          rm -f "$OUT_DIR/汇总.txt" "$OUT_DIR/简码表.txt" "$OUT_DIR/合并码表.txt"
          for d in "$OUT_DIR"/thread-*; do
            [ -d "$d" ] || continue
            rm -f "$d/简码表.txt" "$d/合并码表.txt"
          done
          rm -rf 历史 seed
          rm -f 尺度-来源.json
          echo "剩余文件："
          ls -1 "$OUT_DIR"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codegenie-${{ inputs.out_dir }}-run${{ github.run_number }}-s${{ matrix.shard }}
          path: |
            ${{ inputs.out_dir }}/
            run.log
            build.log
            config.ron
          if-no-files-found: warn
          retention-days: 14
