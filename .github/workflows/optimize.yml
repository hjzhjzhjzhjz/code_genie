name: CodeGenie 退火优化

# 放在默认分支上，用 workflow_dispatch 手动触发。
# 代码从 inputs.ref 检出；配置以 inputs.config_base 为基础；输入文件从 inputs.files_dir 取。
#
# 续算三种来源（互斥，最多选一个）：
#   seed_keymap  仓库内 keymap 直接播种（所有线程同一初始解）
#   seed_run_id  历史运行的 artifact，取其 thread-*/字根键位表.txt 轮流播种
#   resume_run_id 历史运行的 artifact，直接续算其 checkpoint（温度/步数接着走）
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要运行的代码分支或 tag
        required: true
        default: moling
        type: string
      config_base:
        description: 基础配置（仓库内路径，默认 config.toml.example）
        required: true
        default: config.toml.example
        type: string
      files_dir:
        description: 输入文件所在目录（. 表示仓库根目录）
        required: true
        default: "."
        type: string
      total_steps:
        description: total_steps（2 万步冒烟 / 200 万步 / 4000 万步；resume 时以 checkpoint 里记录的为准）
        required: true
        default: "20000"
        type: string
      threads:
        description: 并行线程数（ubuntu-latest 是 4 vCPU）
        required: true
        default: "4"
        type: string
      shard_list:
        description: 分片列表（JSON 数组，[1] 表示不分片，[1,2,3,4] 表示四片并行）
        required: true
        default: "[1]"
        type: string
      mapping:
        description: 字根映射表（仓库内路径，留空则不套 PUA 显示字）
        required: false
        default: ""
        type: string
      out_dir:
        description: 输出目录名（同时作为 artifact 名的一部分）
        required: true
        default: out-smoke
        type: string
      seed_keymap:
        description: 播种：仓库内 keymap 路径（与 seed_run_id / resume_run_id 互斥）
        required: false
        default: ""
        type: string
      seed_run_id:
        description: 播种：历史运行 id，用其 thread-*/字根键位表.txt（与 seed_keymap / resume_run_id 互斥）
        required: false
        default: ""
        type: string
      seed_shard:
        description: 播种来源分片号（留空 = 合并该运行全部分片）
        required: false
        default: ""
        type: string
      resume_run_id:
        description: 续算：历史运行 id，从其 checkpoint 接着跑（与 seed_* 互斥）
        required: false
        default: ""
        type: string
      resume_shard:
        description: 续算来源分片号（默认 1）
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  optimize:
    name: 编译并运行模拟退火（分片 ${{ matrix.shard }}）
    runs-on: ubuntu-24.04
    # 单个分片不跑时不启动
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    concurrency:
      group: codegenie-${{ inputs.ref }}-${{ inputs.out_dir }}-s${{ matrix.shard }}
      cancel-in-progress: false
    # GitHub 单 job 硬上限 360 分钟，留 10 分钟余量给 artifact 上传
    timeout-minutes: 350
    env:
      OUT_DIR: ${{ inputs.out_dir }}
      TOTAL_STEPS: ${{ inputs.total_steps }}
      THREADS: ${{ inputs.threads }}
      CONFIG_BASE: ${{ inputs.config_base }}
      FILES_DIR: ${{ inputs.files_dir }}
      SEED_KEYMAP: ${{ inputs.seed_keymap }}
      SEED_RUN: ${{ inputs.seed_run_id }}
      SEED_SHARD: ${{ inputs.seed_shard }}
      RESUME_RUN: ${{ inputs.resume_run_id }}
      RESUME_SHARD: ${{ inputs.resume_shard }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: 校验播种/续算参数
        run: |
          set -e
          n=0
          [ -n "$SEED_KEYMAP" ] && n=$((n+1))
          [ -n "$SEED_RUN" ] && n=$((n+1))
          [ -n "$RESUME_RUN" ] && n=$((n+1))
          if [ "$n" -gt 1 ]; then
            echo "::error::seed_keymap / seed_run_id / resume_run_id 最多选一个（当前 $n 个）"
            exit 1
          fi
          if [ -n "$SEED_KEYMAP" ] && [ ! -f "$SEED_KEYMAP" ]; then
            echo "::error::种子 keymap 不存在: $SEED_KEYMAP"
            exit 1
          fi
          for r in "$SEED_RUN" "$RESUME_RUN"; do
            if [ -n "$r" ] && ! echo "$r" | grep -qE '^[0-9]+$'; then
              echo "::error::运行 id 必须是数字: $r"
              exit 1
            fi
          done
          if [ "$n" -eq 0 ]; then src="无（全新随机）"; elif [ -n "$SEED_KEYMAP" ]; then src="keymap 播种"; elif [ -n "$SEED_RUN" ]; then src="历史播种"; else src="断点续算"; fi
          echo "参数校验通过（来源：$src）"

      - name: 下载历史产物（播种/续算来源）
        if: ${{ inputs.seed_run_id != '' || inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p 历史
          列出() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts?per_page=100" \
              --paginate --jq '.artifacts[] | select(.expired == false) | .name'
          }
          取一个() {  # $1=run_id $2=分片号
            local names pick
            names=$(列出 "$1")
            echo "--- 运行 $1 的 artifact ---"
            echo "$names"
            pick=""
            if [ -n "$2" ]; then
              pick=$(echo "$names" | grep -- "-s$2$" | head -n1 || true)
            fi
            if [ -z "$pick" ]; then
              local total
              total=$(echo "$names" | grep -c . || true)
              if [ "$total" -eq 1 ]; then
                pick=$(echo "$names" | head -n1)
              else
                echo "::error::没能唯一定位 artifact（分片=$2），请检查 seed_shard/resume_shard"
                exit 1
              fi
            fi
            echo "下载 $pick"
            gh run download "$1" -n "$pick" -D "历史/$pick"
          }

          if [ -n "$RESUME_RUN" ]; then
            取一个 "$RESUME_RUN" "$RESUME_SHARD"
          fi
          if [ -n "$SEED_RUN" ]; then
            if [ -n "$SEED_SHARD" ]; then
              取一个 "$SEED_RUN" "$SEED_SHARD"
            else
              for n in $(列出 "$SEED_RUN" | grep '^codegenie-' || true); do
                echo "下载 $n"
                gh run download "$SEED_RUN" -n "$n" -D "历史/$n"
              done
            fi
          fi

      - name: 准备播种/续算目录
        if: ${{ inputs.seed_run_id != '' || inputs.resume_run_id != '' }}
        run: |
          set -e
          if [ -n "$RESUME_RUN" ]; then
            meta=$(find 历史 -maxdepth 5 -type f -path '*/checkpoint/meta.json' | head -n1)
            [ -n "$meta" ] || { echo "::error::历史产物里没有 checkpoint/meta.json，无法续算"; exit 1; }
            src=$(dirname "$(dirname "$meta")")
            echo "续算目录：$src"
            if [ "$src" != "$OUT_DIR" ]; then
              rm -rf "$OUT_DIR"
              mv "$src" "$OUT_DIR"
            fi
            echo "--- checkpoint 内容 ---"
            ls -1 "$OUT_DIR/checkpoint" | head -n 12
            [ -f "$OUT_DIR/inputs/config.toml" ] || {
              echo "::error::缺 $OUT_DIR/inputs/config.toml，无法续算"
              exit 1
            }
          fi
          if [ -n "$SEED_RUN" ]; then
            rm -rf seed
            mkdir -p seed
            i=0
            while IFS= read -r km; do
              nn=$(printf 'thread-%02d' "$i")
              mkdir -p "seed/$nn"
              cp "$km" "seed/$nn/字根键位表.txt"
              i=$((i+1))
            done < <(find 历史 -type f -path '*/thread-*/字根键位表.txt' | sort)
            if [ "$i" -eq 0 ]; then
              echo "::error::历史产物里没有 thread-*/字根键位表.txt，无法播种"
              exit 1
            fi
            echo "已收集 $i 个种子："
            ls -1 seed
          fi

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 生成 config.toml
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          steps = os.environ["TOTAL_STEPS"].strip()
          threads = os.environ["THREADS"].strip()
          files_dir = (os.environ.get("FILES_DIR") or ".").strip().rstrip("/")
          base = (os.environ.get("CONFIG_BASE") or "config.toml.example").strip()

          if not steps.isdigit() or int(steps) <= 0:
              sys.exit(f"total_steps 非法: {steps!r}")
          if not threads.isdigit() or int(threads) <= 0:
              sys.exit(f"threads 非法: {threads!r}")

          src = pathlib.Path(base)
          if not src.is_file():
              sys.exit(f"找不到基础配置: {base}")
          lines = src.read_text(encoding="utf-8").splitlines()

          FILE_KEYS = ("fixed", "dynamic", "splits", "pair_equiv", "key_dist")
          section, hit_steps, hit_threads, out = None, False, False, []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  section = stripped.strip("[]").strip()

              if section == "annealing":
                  m = re.match(r"^(\s*total_steps\s*=\s*)([0-9_]+)(\s*#.*)?$", line)
                  if m:
                      line = m.group(1) + steps + (m.group(3) or "")
                      hit_steps = True
                  m = re.match(r"^(\s*threads\s*=\s*)([0-9_]+)(\s*#.*)?$", line)
                  if m:
                      line = m.group(1) + threads + (m.group(3) or "")
                      hit_threads = True

              if section == "files" and files_dir not in ("", "."):
                  m = re.match(r'^(\s*(' + "|".join(FILE_KEYS) + r')\s*=\s*")([^"]*)(")', line)
                  if m:
                      name = os.path.basename(m.group(3).replace("\\", "/"))
                      line = f"{m.group(1)}{files_dir}/{name}{m.group(4)}"

              out.append(line)

          if not (hit_steps and hit_threads):
              sys.exit(f"未定位到 total_steps/threads（steps={hit_steps}, threads={hit_threads}）")

          pathlib.Path("config.toml").write_text("\n".join(out) + "\n", encoding="utf-8")
          print(f"config.toml 已生成：base={base} total_steps={steps} threads={threads} files_dir={files_dir}")
          PY
          echo "--- [annealing] ---"
          grep -nE '^\s*(threads|total_steps)\s*=' config.toml
          echo "--- [files] ---"
          sed -n '/^\[files\]/,/^\[/p' config.toml | grep -vE '^\[' || true
          echo "--- 输入文件 ---"
          for f in $(sed -n '/^\[files\]/,/^\[/p' config.toml | grep -oE '"[^"]+"' | tr -d '"'); do
            if [ -f "$f" ]; then
              echo "OK   $f ($(wc -c < "$f") bytes, $(wc -l < "$f") lines)"
            else
              echo "MISS $f"
            fi
          done

      - name: 编译（release + LTO）
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: 运行退火
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          # 用 SIGINT 限时：程序自带 Ctrl-C 处理，会写好 checkpoint 后正常退出，
          # 避免 job 被硬超时杀掉、checkpoint 来不及落盘。
          if [ -n "$RESUME_RUN" ]; then
            echo "=== 断点续算：resume -d $OUT_DIR ==="
            timeout --signal=INT --kill-after=60s 300m \
              ./target/release/code_genie resume -d "$OUT_DIR" 2>&1 | tee run.log \
              || echo "::warning::续算被 300 分钟时限中断（exit=$?），artifacts 中保留了最新 checkpoint，可再次 resume"
          else
            ARGS=()
            if [ -n "$SEED_KEYMAP" ]; then ARGS+=(--seed-keymap "$SEED_KEYMAP"); fi
            if [ -n "$SEED_RUN" ]; then ARGS+=(--seed-dir seed); fi
            if [ "${#ARGS[@]}" -gt 0 ]; then
              echo "=== 播种续算：optimize ${ARGS[*]} ==="
            fi
            timeout --signal=INT --kill-after=60s 300m \
              ./target/release/code_genie -c config.toml optimize -d "$OUT_DIR" "${ARGS[@]}" 2>&1 | tee run.log \
              || echo "::warning::运行被 300 分钟时限中断（exit=$?），artifacts 中保留了最新 checkpoint，可 resume 续算"
          fi

      - name: 导出全码表
        if: always()
        run: |
          if [ ! -f "$OUT_DIR/字根键位表.txt" ]; then
            echo "::warning::没有 字根键位表.txt，跳过导出"
            exit 0
          fi
          SIMPLE_ARG=""
          if [ -f "$OUT_DIR/简码表.txt" ]; then
            SIMPLE_ARG="--simple $OUT_DIR/简码表.txt"
          fi
          ./target/release/code_genie export \
            --keymap "$OUT_DIR/字根键位表.txt" \
            --chaifen moling/chaifen-all.txt \
            $SIMPLE_ARG \
            --output "$OUT_DIR/全码表.txt"
          echo "--- 前 4 行 ---"
          head -n 4 "$OUT_DIR/全码表.txt"
          echo "--- 行数 ---"
          wc -l < "$OUT_DIR/全码表.txt"

          # 每个线程各出一份
          for d in "$OUT_DIR"/thread-*; do
            [ -d "$d" ] || continue
            [ -f "$d/字根键位表.txt" ] || continue
            THREAD_ARG=""
            if [ -f "$d/简码表.txt" ]; then
              THREAD_ARG="--simple $d/简码表.txt"
            fi
            ./target/release/code_genie export \
              --keymap "$d/字根键位表.txt" \
              --chaifen moling/chaifen-all.txt \
              $THREAD_ARG \
              --output "$d/全码表.txt"
            echo "  $(basename "$d"): $(wc -l < "$d/全码表.txt") 行"
          done

      - name: 生成字根图
        if: always()
        env:
          KEYMAP: ${{ inputs.out_dir }}/字根键位表.txt
          MAPPING: ${{ inputs.mapping }}
        run: |
          if [ ! -f "$KEYMAP" ]; then
            echo "::warning::没有 keymap，跳过字根图"
            exit 0
          fi
          if [ -z "$MAPPING" ]; then
            ./target/release/code_genie chart --keymap "$KEYMAP" --output "$OUT_DIR/字根图.html"
          else
            ./target/release/code_genie chart --keymap "$KEYMAP" --mapping "$MAPPING" --output "$OUT_DIR/字根图.html"
          fi
          ls -l "$OUT_DIR/字根图.html"

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "### CodeGenie 退火结果"
            echo ""
            echo "- 分支：\`${{ inputs.ref }}\`"
            echo "- 配置基础：\`$CONFIG_BASE\`"
            echo "- 输入目录：\`$FILES_DIR\`"
            echo "- total_steps：\`$TOTAL_STEPS\`"
            echo "- 线程数：\`$THREADS\`"
            echo "- 输出目录：\`$OUT_DIR\`"
            if [ -n "$RESUME_RUN" ]; then
              echo "- 续算来源：运行 \`$RESUME_RUN\`（分片 $RESUME_SHARD）"
            elif [ -n "$SEED_RUN" ]; then
              echo "- 播种来源：运行 \`$SEED_RUN\` 的历史线程"
            elif [ -n "$SEED_KEYMAP" ]; then
              echo "- 播种来源：\`$SEED_KEYMAP\`"
            fi
            echo ""
            if [ -f "$OUT_DIR/汇总.txt" ]; then
              echo '```'
              head -n 20 "$OUT_DIR/汇总.txt"
              echo '```'
            else
              echo "未找到 \`$OUT_DIR/汇总.txt\`，运行可能未完成。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理中间产物
        if: always()
        run: |
          rm -f "$OUT_DIR/单字编码表.txt" "$OUT_DIR/汇总.txt" "$OUT_DIR/简码表.txt" "$OUT_DIR/合并码表.txt"
          for d in "$OUT_DIR"/thread-*; do
            [ -d "$d" ] || continue
            rm -f "$d/单字编码表.txt" "$d/简码表.txt" "$d/合并码表.txt"
          done
          rm -rf 历史 seed
          echo "剩余文件："
          ls -1 "$OUT_DIR"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codegenie-${{ inputs.out_dir }}-run${{ github.run_number }}-s${{ matrix.shard }}
          path: |
            ${{ inputs.out_dir }}/
            run.log
            build.log
            config.toml
          if-no-files-found: warn
          retention-days: 14
