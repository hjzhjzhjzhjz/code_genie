name: 探测 librime

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 查包
        run: |
          sudo apt-get update -qq
          echo "=== policy ==="
          apt-cache policy librime-dev librime-bin librime-data 2>&1 | head -40
          echo "=== install ==="
          sudo apt-get install -y -qq librime-dev librime-bin 2>&1 | tail -20 || echo "INSTALL_FAILED"
          echo "=== files ==="
          ls /usr/include/rime_api.h 2>&1
          ls /usr/bin/rime_* 2>&1
          echo "=== version ==="
          pkg-config --modversion rime 2>&1 || true
      - name: 试编译最小客户端
        run: |
          cat > t.c <<'EOF'
          #include <rime_api.h>
          #include <stdio.h>
          int main(void) {
            RimeApi* rime = rime_get_api();
            printf("api=%p version=%s\n", (void*)rime, rime->get_version());
            return 0;
          }
          EOF
          gcc t.c -o t $(pkg-config --cflags --libs rime 2>/dev/null || echo "-lrime") 2>&1 | head -20
          ./t 2>&1 | head -5
