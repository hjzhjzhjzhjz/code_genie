name: CodeGenie 测评码表导出

on:
  workflow_dispatch:
    inputs:
      keymap:
        description: 键位映射文件（仓库内路径；同目录需有 optimize 产出的 完整码表.txt）
        required: true
        default: runs/s4-export/output-keymap.txt
        type: string
      out_name:
        description: 输出文件名
        required: true
        default: table-s4.txt
        type: string

permissions:
  contents: read

jobs:
  export:
    name: 编译并导出测评码表
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: 提取完整码表（optimize 已产出，无需再导）
        env:
          KEYMAP: ${{ inputs.keymap }}
          OUT_NAME: ${{ inputs.out_name }}
        run: |
          set -euo pipefail
          cp "$(dirname "$KEYMAP")/完整码表.txt" "$OUT_NAME"
          echo "--- 前 6 行 ---"
          head -n 6 "$OUT_NAME"
          echo "--- 行数 ---"
          wc -l < "$OUT_NAME"

      # 字根表页面（chart）已下线：本 workflow 只导出测评码表，不再附带生成 HTML 页面。

      - name: 上传码表
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-table-run${{ github.run_number }}
          path: |
            ${{ inputs.out_name }}
            build.log
          if-no-files-found: warn
          retention-days: 14
