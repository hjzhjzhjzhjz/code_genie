name: CodeGenie 测评码表导出

on:
  workflow_dispatch:
    inputs:
      keymap:
        description: 键位映射文件（仓库内路径；同目录需有 optimize 产出的 完整码表.txt）
        required: true
        default: runs/s4-export/output-keymap.txt
        type: string
      chaifen:
        description: 纯拆分表（仓库内路径）
        required: true
        default: moling/拆分全表.txt
        type: string
      mapping:
        description: 字根映射表（仓库内路径，留空表示不用）
        required: false
        default: runs/s4-export/mapping.tsv
        type: string
      out_name:
        description: 输出文件名
        required: true
        default: table-s4.txt
        type: string

permissions:
  contents: read

jobs:
  export:
    name: 编译并导出测评码表
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖与 target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 编译
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      # 拆分全表.txt / 字根约束.txt 等是 `code_genie prepare` 的产物，不入库，用前必须先重建。
      - name: 生成码灵输入文件（code_genie prepare）
        run: |
          set -euo pipefail
          ./target/release/code_genie prepare --dir moling

      - name: 提取完整码表（optimize 已产出，无需再导）
        env:
          KEYMAP: ${{ inputs.keymap }}
          OUT_NAME: ${{ inputs.out_name }}
        run: |
          set -euo pipefail
          cp "$(dirname "$KEYMAP")/完整码表.txt" "$OUT_NAME"
          echo "--- 前 6 行 ---"
          head -n 6 "$OUT_NAME"
          echo "--- 行数 ---"
          wc -l < "$OUT_NAME"

      - name: 生成字根表页面（完整分页）
        if: always()
        env:
          KEYMAP: ${{ inputs.keymap }}
          CHAIFEN: ${{ inputs.chaifen }}
          MAPPING: ${{ inputs.mapping }}
        run: |
          set -euo pipefail
          # chart -d 要求目录内齐备 output-keymap.txt / 拆分全表.txt / 全字频表.txt；
          # 后两者由上面的 prepare 步骤产出，故这里只做拼装。
          mkdir -p 字根图
          cp "$KEYMAP" 字根图/output-keymap.txt
          cp "$CHAIFEN" 字根图/拆分全表.txt
          cp moling/全字频表.txt 字根图/全字频表.txt
          if [ -n "$MAPPING" ] && [ -f "$MAPPING" ]; then
            cp "$MAPPING" 字根图/roots-mapping.tsv
          fi
          ./target/release/code_genie chart -d 字根图
          ls -l 字根图/

      - name: 上传码表
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-table-run${{ github.run_number }}
          path: |
            ${{ inputs.out_name }}
            build.log
            字根图/
          if-no-files-found: warn
          retention-days: 14
